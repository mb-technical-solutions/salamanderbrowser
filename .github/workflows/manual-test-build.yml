name: Manual Test Build

# On-demand, unsigned build of the current branch for manual testing, with no
# public-facing side effects: unlike release.yml/rolling-release.yml, this
# creates no GitHub Release, Discord post, or website deploy. Output is a
# private GitHub Actions artifact, downloadable only by repo collaborators.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 #v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 #master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config unzip xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2.9.2
        with:
          workdir: ./src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build sidecar binary
        shell: bash
        working-directory: ./src-tauri
        run: cargo build --bin salamander-proxy --target ${{ matrix.target }} --release

      - name: Copy sidecar binary to Tauri binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp src-tauri/target/${{ matrix.target }}/release/salamander-proxy src-tauri/binaries/salamander-proxy-${{ matrix.target }}
          chmod +x src-tauri/binaries/salamander-proxy-${{ matrix.target }}

      - name: Download verified Xray-core sidecar
        run: node src-tauri/download-xray.mjs --target ${{ matrix.target }}

      - name: Build Tauri app (unsigned)
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: salamander-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14
